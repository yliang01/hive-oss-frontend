<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>OSS 文件管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="page-files">
<!-- 通知容器 -->
<div id="notification-container" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

<main class="page-main">
    <div class="container container--page">
        <header class="page-header">
            <h1 class="page-title">OSS 文件管理</h1>
            <div class="page-header__actions">
                <button onclick="backToCategories()" class="btn btn-outline-dark btn-ui-secondary">返回</button>
            </div>
        </header>
        <section class="files-section">
            <div class="files-toolbar">
                <div class="files-toolbar__group files-toolbar__group--title">
                    <h2 class="files-toolbar__title">文件管理 - <span id="current-category"></span></h2>
                    <div class="btn-group btn-group-sm ms-2" role="group" aria-label="视图切换">
                        <button type="button" class="btn btn-outline-secondary btn-ui-compact" id="view-mode-list" onclick="switchViewMode('list')" title="列表视图">
                            <i class="bi bi-list-ul" aria-hidden="true"></i> 列表
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-ui-compact" id="view-mode-grid" onclick="switchViewMode('grid')" title="网格视图">
                            <i class="bi bi-grid-3x3-gap" aria-hidden="true"></i> 网格
                        </button>
                    </div>
                    <button onclick="refreshFileList()" class="btn btn-outline-secondary btn-ui-compact refresh-btn ms-2" id="refresh-btn">
                        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> 刷新
                    </button>
                </div>
                <div class="files-toolbar__group files-toolbar__group--actions">
                    <div class="files-toolbar__group-select">
                        <select id="group-select" class="form-select form-select-sm" onchange="changeGroupFilter(this.value)">
                            <option value="">未分组</option>
                        </select>
                    </div>
                    <div class="search-container files-toolbar__search">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchInput" placeholder="搜索文件名..." 
                                   onkeypress="handleSearchKeyPress(event)">
                            <button class="btn" type="button" onclick="performSearch()">
                                <i class="bi bi-search" aria-hidden="true"></i>
                            </button>
                            <button class="btn" type="button" onclick="clearSearch()" id="clearSearchBtn" style="display: none;">
                                <i class="bi bi-x" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <div class="files-toolbar__buttons">
                        <span id="toolbar-grid-select-count" class="badge text-bg-primary align-self-center" style="display:none">
                            已选 <span id="toolbar-grid-select-num">0</span> 张
                            <button type="button" onclick="clearGridSelection()" class="btn-close btn-close-white ms-1" aria-label="清除" style="font-size:0.55em;vertical-align:middle"></button>
                        </span>
                        <button id="toolbar-assign-btn" onclick="assignSelectedFiles()" class="btn btn-outline-primary btn-ui-secondary">
                            批量分配
                        </button>
                        <button id="toolbar-grid-delete-btn" onclick="gridDeleteSelected()" class="btn btn-outline-danger btn-ui-secondary" disabled style="display:none">
                            删除选中
                        </button>
                        <button onclick="openUploadModal()" class="btn btn-primary btn-ui-primary">
                            <i class="bi bi-cloud-upload" aria-hidden="true"></i> 上传文件
                        </button>
                        <button onclick="confirmDeleteFiles()" class="btn btn-outline-primary btn-ui-secondary" id="sync-local-btn">
                            <span class="sync-icon">↻</span> 确认删除
                        </button>
                        <button onclick="syncRemoteFiles()" class="btn btn-outline-success btn-ui-secondary" id="sync-remote-btn">
                            <span class="sync-icon">⟳</span> 远程同步
                        </button>
                    </div>
                </div>
            </div>
            <div id="files-list-view" class="table-responsive files-table-wrap">
                <table id="file-table" class="table table-striped table-hover align-middle files-table">
                    <thead>
                    <tr>
                        <th>
                            <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll(this.checked)">
                        </th>
                        <th>文件名</th>
                        <th>Key</th>
                        <th>大小</th>
                        <th>状态</th>
                        <th>更新时间</th>
                        <th>解冻时间</th>
                        <th>分组</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="files-grid-view" class="files-grid-wrap" style="display: none;" aria-label="网格视图">
                <div id="files-grid" class="files-grid row g-3"></div>
            </div>
            <div id="pagination" class="files-pagination"></div>
        </section>
    </div>
</main>

<!-- 确认对话框 -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalLabel">
                    <i class="bi bi-exclamation-triangle text-warning"></i> 确认操作
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">确定要执行此操作吗？</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmBtn">确认</button>
            </div>
        </div>
    </div>
</div>

<!-- 批量分配模态框 -->
<div class="modal fade" id="assignModal" tabindex="-1" aria-labelledby="assignModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="assignModalLabel">
                    <i class="bi bi-folder-plus text-primary"></i> 批量分配
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted mb-2" id="assign-selected-count">已选 0 个文件</p>
                <div class="mb-3">
                    <label for="assign-group-select" class="form-label">目标分组</label>
                    <select id="assign-group-select" class="form-select">
                        <option value="">选择目标分组</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="assign-confirm-btn" onclick="confirmAssignSelectedFiles()">确认分配</button>
            </div>
        </div>
    </div>
</div>

<!-- 上传文件模态框 -->
<div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="uploadModalLabel">
                    <i class="bi bi-cloud-upload text-primary"></i> 上传文件
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="fileInput" class="form-label">选择文件</label>
                        <div class="upload-area" id="uploadArea">
                            <div class="upload-placeholder">
                                <i class="bi bi-cloud-upload upload-icon"></i>
                                <p class="upload-text">点击选择文件或拖拽文件到此处</p>
                                <p class="upload-hint upload-area-hint">支持大文件流式上传</p>
                            </div>
                            <input type="file" id="fileInput" class="form-control" style="display: none;" accept="*/*" multiple>
                        </div>
                        <ul id="uploadFileList" class="upload-file-list list-unstyled mb-2 mt-2" style="display:none"></ul>
                    </div>

                </form>
                <div id="uploadProgress" class="mt-3" style="display: none;">
                    <div class="progress">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                    </div>
                    <div class="text-center mt-2">
                        <small class="text-muted" id="uploadStatus">准备上传...</small>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="uploadBtn" onclick="uploadFile()" disabled>
                    <i class="bi bi-cloud-upload"></i> 开始上传
                </button>
            </div>
        </div>
    </div>
</div>
<!-- 文件预览模态框 -->
<div class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="previewModalLabel">
                    <i class="bi bi-eye text-primary"></i> 文件预览
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body preview-modal-body">
                <div id="previewModalContent" class="preview-modal-content"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/files.js"></script>
<div id="download-progress-bar"
     style="display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;min-width:200px;"
     class="alert alert-info py-2 px-3"></div>
</body>
</html>
