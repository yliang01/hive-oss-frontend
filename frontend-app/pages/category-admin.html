<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>分类与分组管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="page-files">
<div id="notification-container" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>
<main class="page-main">
    <div class="container container--page">
        <header class="page-header">
            <h1 class="page-title">分类与分组管理</h1>
            <div class="page-header__actions">
                <button class="btn btn-outline-dark btn-ui-secondary" onclick="backHome()">返回首页</button>
            </div>
        </header>
        <section class="files-section">
            <div class="d-flex gap-2 mb-3 flex-wrap">
                <button class="btn btn-primary btn-ui-secondary" onclick="createCategory()">新增分类</button>
                <button class="btn btn-outline-secondary btn-ui-secondary" onclick="loadCategories()">刷新</button>
            </div>
            <div class="table-responsive mb-4">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th>编码</th><th>名称</th><th>存储层</th><th>启用</th><th>排序</th><th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="category-table-body"></tbody>
                </table>
            </div>
            <h5 class="mb-2">分组管理 - <span id="current-category-label">未选择</span></h5>
            <div class="d-flex gap-2 mb-3 flex-wrap">
                <button class="btn btn-outline-primary btn-ui-secondary" onclick="createGroup()">新增分组</button>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th>分组编码</th><th>分组名称</th><th>启用</th><th>排序</th><th>操作</th>
                    </tr>
                    </thead>
                    <tbody id="group-table-body"></tbody>
                </table>
            </div>
        </section>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="../js/category-admin.js"></script>
</body>
</html>
