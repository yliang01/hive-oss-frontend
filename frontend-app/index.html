<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>OSS 管理 - 首页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="page-home">
<!-- 通知容器 -->
<div id="notification-container" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

<main class="page-main">
    <div class="container container--page">
        <header class="page-header">
            <h1 class="page-title">OSS 管理</h1>
        </header>
        <div class="row g-4 row--sections">
            <!-- 数据库备份与加载 -->
            <section class="col-12 col-lg-6">
                <div class="card home-card">
                    <div class="card-header home-card__header">
                        <h2 class="home-card__title"><i class="bi bi-database me-2" aria-hidden="true"></i>数据库备份与加载</h2>
                    </div>
                    <div class="card-body home-card__body">
                        <p class="home-card__desc text-muted small">备份数据库到 OSS（加密），或从备份恢复</p>
                        <div class="home-actions">
                            <button type="button" class="btn btn-primary btn-ui-primary" id="backup-btn" onclick="handleBackup()">
                                <i class="bi bi-cloud-upload" aria-hidden="true"></i> 开始备份
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-ui-secondary" onclick="loadBackupList()">
                                <i class="bi bi-list-ul" aria-hidden="true"></i> 刷新备份列表
                            </button>
                        </div>
                        <div id="backup-ack-status" class="backup-task-status" style="display: none;">
                            <div class="backup-task-status-header">
                                <span id="backup-status-badge" class="badge text-bg-secondary">未开始</span>
                                <span id="backup-status-updated-at" class="text-muted small"></span>
                            </div>
                            <div class="backup-task-status-body small">
                                <div class="backup-task-status-row"><span class="text-muted">任务：</span><span id="backup-task-type">-</span></div>
                                <div class="backup-task-status-row"><span class="text-muted">批次：</span><span id="backup-task-batch-id" class="font-monospace">-</span></div>
                                <div class="backup-task-status-row"><span class="text-muted">阶段：</span><span id="backup-task-phase">-</span></div>
                                <div id="backup-task-detail-row" class="backup-task-status-row" style="display: none;"><span class="text-muted">详情：</span><span id="backup-task-detail"></span></div>
                                <div class="text-muted backup-task-status-meta"><span id="backup-task-poll-attempts">轮询 0 次</span> · <span id="backup-task-elapsed">已耗时 0 秒</span></div>
                            </div>
                        </div>
                        <h6 class="home-card__subtitle">备份历史</h6>
                        <div id="backup-list-container" class="backup-list-wrap">
                            <ul id="backup-list" class="list-group list-group-flush"></ul>
                            <div id="backup-list-empty" class="text-secondary small">加载中…</div>
                        </div>
                    </div>
                </div>
            </section>
            <!-- 文件分类 -->
            <section class="col-12 col-lg-6">
                <div class="card home-card">
                    <div class="card-header home-card__header d-flex justify-content-between align-items-center flex-wrap gap-2">
                        <h2 class="home-card__title mb-0"><i class="bi bi-grid-3x3-gap me-2" aria-hidden="true"></i>文件分类</h2>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-outline-dark btn-ui-compact" onclick="goCategoryAdmin()">
                                <i class="bi bi-sliders" aria-hidden="true"></i> 分类管理
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-ui-compact refresh-btn" id="refresh-btn" onclick="refreshCategories()">
                                <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> 刷新
                            </button>
                        </div>
                    </div>
                    <div class="card-body home-card__body">
                        <ul id="categories" class="list-group list-group-flush bucket-list"></ul>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>
<!-- 确认对话框 -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalLabel">
                    <i class="bi bi-exclamation-triangle text-warning"></i> 确认操作
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">确定要执行此操作吗？</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger" id="confirmBtn">确认</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./js/home.js"></script>
</body>
</html>
