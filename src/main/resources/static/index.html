<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>OSS 管理 - 首页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
<!-- 通知容器 -->
<div id="notification-container" class="position-fixed top-0 end-0 p-3" style="z-index: 9999;"></div>

<div class="container my-5">
    <h1 class="mb-3">OSS 管理</h1>
    <hr/>
    <div class="row g-4">
        <!-- 数据库备份与加载 -->
        <section class="col-12 col-lg-6">
            <div class="card home-card">
                <div class="card-header">
                    <h2 class="h5 mb-0"><i class="bi bi-database me-2"></i>数据库备份与加载</h2>
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-3">备份数据库到 OSS（加密），或从备份恢复</p>
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <button type="button" class="btn btn-primary" id="backup-btn" onclick="handleBackup()">
                            <i class="bi bi-cloud-upload"></i> 开始备份
                        </button>
                        <button type="button" class="btn btn-outline-primary" onclick="loadBackupList()">
                            <i class="bi bi-list-ul"></i> 刷新备份列表
                        </button>
                    </div>
                    <div id="backup-ack-status" class="backup-task-status mb-3" style="display: none;">
                        <div class="backup-task-status-header">
                            <span id="backup-status-badge" class="badge text-bg-secondary">未开始</span>
                            <span id="backup-status-updated-at" class="text-muted small"></span>
                        </div>
                        <div class="backup-task-status-body small">
                            <div><span class="text-muted">任务：</span><span id="backup-task-type">-</span></div>
                            <div><span class="text-muted">批次：</span><span id="backup-task-batch-id" class="font-monospace">-</span></div>
                            <div><span class="text-muted">阶段：</span><span id="backup-task-phase">-</span></div>
                            <div id="backup-task-detail-row" style="display: none;"><span class="text-muted">详情：</span><span id="backup-task-detail"></span></div>
                            <div class="text-muted"><span id="backup-task-poll-attempts">轮询 0 次</span> · <span id="backup-task-elapsed">已耗时 0 秒</span></div>
                        </div>
                    </div>
                    <h6 class="h6 mb-2">备份历史</h6>
                    <div id="backup-list-container">
                        <ul id="backup-list" class="list-group list-group-flush"></ul>
                        <div id="backup-list-empty" class="text-secondary small">加载中…</div>
                    </div>
                </div>
            </div>
        </section>
        <!-- Bucket 选择 -->
        <section class="col-12 col-lg-6">
            <div class="card home-card">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h2 class="h5 mb-0"><i class="bi bi-bucket me-2"></i>Bucket 选择</h2>
                    <button type="button" class="btn btn-outline-secondary btn-sm refresh-btn" id="refresh-btn" onclick="refreshBuckets()">
                        <i class="bi bi-arrow-clockwise"></i> 刷新
                    </button>
                </div>
                <div class="card-body">
                    <ul id="buckets" class="list-group list-group-flush"></ul>
                </div>
            </div>
        </section>
    </div>
</div>
<script type="module" src="js/home.js"></script>
</body>
</html>
